<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DROPLINE — effects</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f14; color: #d8e2ea; font: 13px/1.3 system-ui, sans-serif; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #panel { position: fixed; left: 12px; top: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
      #panel > * { pointer-events: auto; }
      button { background: #1a222c; color: inherit; border: 1px solid #33414f; border-radius: 4px; padding: 5px 9px; font: inherit; cursor: pointer; }
      button[aria-pressed='true'] { background: #2f86c6; border-color: #58d6ff; color: #fff; }
      #stats { position: fixed; left: 12px; bottom: 12px; font: 12px/1.4 ui-monospace, monospace; background: #0b0f14cc; padding: 6px 9px; border-radius: 4px; pointer-events: none; white-space: pre; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="panel"></div>
    <div id="stats"></div>
    <script type="module" src="/src/effectsViewer.ts"></script>
  </body>
</html>
